<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANV Trust Portal</title>
<style>
  :root {
    --bg: #0b1220;
    --bg2: #111a2e;
    --accent: #4f7cff;
    --text: #f4f6fb;
    --muted: #9aa4bf;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg) 70%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    text-align: center;
    max-width: 560px;
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 28px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), #7c5cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.5px;
  }
  h1 {
    font-size: clamp(24px, 5vw, 34px);
    margin: 0 0 12px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  p {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 32px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(79, 124, 255, 0.12);
    border: 1px solid rgba(79, 124, 255, 0.3);
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  footer {
    margin-top: 48px;
    color: #4d5773;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">A</div>
    <h1>ANV Trust Portal</h1>
    <p>Yakında burada olacağız. Portalımız şu anda hazırlık aşamasında, çok yakında hizmetinizde.</p>
    <div class="pill"><span class="dot"></span> Yakında yükleniyor</div>
    <footer>&copy; 2026 ANV Trust</footer>
  </div>
</body>
</html>
